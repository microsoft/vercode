[workspace]

members = [
    "vercode",
    "vercode-macros",
]

resolver = "3"

[workspace.package]
version = "0.5.3"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/microsoft/vercode"
repository = "https://github.com/microsoft/vercode"

[profile.release]
debug = true

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
vercode-macros = { path = "vercode-macros", version = "0.5.3" }

# dev dependencies
bincode = "1"
criterion = "0.8"
num_enum = "0.7"
serde = { version = "1", features = ["derive"] }
